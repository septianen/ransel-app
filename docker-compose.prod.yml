# Production stack on the VPS: server + Postgres (private) + Caddy (HTTPS).
# Secrets come from a `.env` file next to this file on the VPS (never committed); see .env.example.
services:
  server:
    image: ${SERVER_IMAGE:-ghcr.io/OWNER/ransel-server:latest}
    restart: unless-stopped
    environment:
      PORT: 8080
      APP_ENV: production
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ characters)}
      JWT_ISSUER: ${JWT_ISSUER:-ransel}
      DATABASE_URL: jdbc:postgresql://db:5432/ransel
      DATABASE_USER: ransel
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://ransel.app}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ransel
      POSTGRES_USER: ransel
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
    volumes:
      - ransel-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ransel"]
      interval: 10s
      retries: 10
    networks: [internal]   # not published to the host

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [server]
    networks: [internal]

networks:
  internal:

volumes:
  ransel-db:
  caddy-data:
  caddy-config:
