# Production (and staging) stack on the VPS: server + Postgres. HTTPS is terminated by the host's nginx, which
# proxies ranselapi.mietek.tech to 127.0.0.1:8080 (see deploy/nginx/). Postgres is never published.
# Configuration comes from a `.env` file next to this file (written by the deploy workflow; never committed).
services:
  server:
    image: ${SERVER_IMAGE:-ghcr.io/septianen/ransel-server:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8080"   # loopback only; nginx is the public entry (staging: 8090)
    volumes:
      - ransel-documents:/data/documents
    environment:
      PORT: 8080
      APP_ENV: ${APP_ENV:-production}   # staging stack: staging (same secret checks, shown as a badge in Karung)
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ characters)}
      PHOTO_SIGNING_SECRET: ${PHOTO_SIGNING_SECRET:?set PHOTO_SIGNING_SECRET (32+ characters)}
      # Trip document files (PDF, images): on the documents volume
      DOCUMENTS_DIR: /data/documents
      JWT_ISSUER: ${JWT_ISSUER:-ransel}
      APP_BASE_URL: ${APP_BASE_URL:-https://ransel.mietek.tech}
      DATABASE_URL: jdbc:postgresql://db:5432/ransel
      DATABASE_USER: ransel
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://ransel.mietek.tech}
      # Explore AI. Blank keys = Explore answers 503 AI_UNAVAILABLE, the rest of the API is unaffected.
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.1-flash-lite}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-gemini-3.5-flash}
      PLACES_API_KEY: ${PLACES_API_KEY:-}
      # Push (FCM). Blank = pushes are only logged; the inbox works either way.
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      # Explore credits (defaults live in AppConfig; set in the VPS .env to change prices of the actions)
      CREDIT_SIGNUP_GRANT: ${CREDIT_SIGNUP_GRANT:-30}
      CREDIT_DAILY_FREE: ${CREDIT_DAILY_FREE:-3}
      CREDIT_COST_SEARCH: ${CREDIT_COST_SEARCH:-3}
      CREDIT_COST_NEXT_BATCH: ${CREDIT_COST_NEXT_BATCH:-1}
      CREDIT_COST_PLACE_DETAIL: ${CREDIT_COST_PLACE_DETAIL:-0}
      CREDIT_COST_RECEIPT: ${CREDIT_COST_RECEIPT:-1}
      CREDIT_PACKAGES: ${CREDIT_PACKAGES:-small:15:10000;medium:40:25000;large:100:55000}
      # App/Universal Links verification files (served at /.well-known/); empty = 404
      ANDROID_PACKAGE: ${ANDROID_PACKAGE:-app.ransel}
      ANDROID_CERT_SHA256: ${ANDROID_CERT_SHA256:-}
      IOS_APP_IDS: ${IOS_APP_IDS:-}
      # Sign-up is open; new accounts verify their email before Explore and the signup credits unlock.
      # Set REGISTRATION_ENABLED=false in the VPS .env to close it again (seeded accounts only).
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}
      SEED_USER_NAME: ${SEED_USER_NAME:-Test User}
      # More accounts: email|password|name;email|password|name
      SEED_USERS: ${SEED_USERS:-}
      # Admin app "Karung" (docs/specs/admin-spec.md): who may call /admin, Karung's origin (added to CORS_ORIGINS),
      # and the reset-email switch (blank = on exactly when SMTP_HOST is set).
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ADMIN_APP_ORIGIN: ${ADMIN_APP_ORIGIN:-https://karung.mietek.tech}
      ADMIN_PASSWORD_RESET_ENABLED: ${ADMIN_PASSWORD_RESET_ENABLED:-}
      # Karung's cost estimates: micro-USD per call (blank = the server's list-price defaults) and the VPS per month.
      COST_LLM_CALL_MICRO_USD: ${COST_LLM_CALL_MICRO_USD:-}
      COST_PLACES_FIND_MICRO_USD: ${COST_PLACES_FIND_MICRO_USD:-}
      COST_PLACES_DETAILS_MICRO_USD: ${COST_PLACES_DETAILS_MICRO_USD:-}
      COST_PLACES_PHOTO_MICRO_USD: ${COST_PLACES_PHOTO_MICRO_USD:-}
      COST_PLACES_AUTOCOMPLETE_MICRO_USD: ${COST_PLACES_AUTOCOMPLETE_MICRO_USD:-}
      COST_PLACES_GEOCODE_MICRO_USD: ${COST_PLACES_GEOCODE_MICRO_USD:-}
      SERVER_MONTHLY_COST_USD: ${SERVER_MONTHLY_COST_USD:-}
      # LLM + Places budget per month (USD; blank = none) and the warning threshold (80, 90 or 100)
      AI_MONTHLY_BUDGET_USD: ${AI_MONTHLY_BUDGET_USD:-}
      AI_BUDGET_ALERT_PERCENT: ${AI_BUDGET_ALERT_PERCENT:-80}
      # the deployed commit, shown on Karung's system page
      APP_VERSION: ${APP_VERSION:-}
      # Outgoing email (verification after sign-up, password reset) over any provider's SMTP relay.
      # Blank SMTP_HOST = nothing is sent (the server logs that), so new accounts cannot verify.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-RANSEL <no-reply@mietek.tech>}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ransel
      POSTGRES_USER: ransel
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
    volumes:
      - ransel-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ransel"]
      interval: 10s
      retries: 10

volumes:
  ransel-db:
  ransel-documents:
