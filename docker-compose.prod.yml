# Production stack on the VPS: server + Postgres. HTTPS is terminated by the host's nginx, which
# proxies ranselapi.mietek.tech to 127.0.0.1:8080 (see deploy/nginx/). Postgres is never published.
# Configuration comes from a `.env` file next to this file (written by the deploy workflow; never committed).
services:
  server:
    image: ${SERVER_IMAGE:-ghcr.io/septianen/ransel-server:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # loopback only; nginx is the public entry
    environment:
      PORT: 8080
      APP_ENV: production
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ characters)}
      JWT_ISSUER: ${JWT_ISSUER:-ransel}
      APP_BASE_URL: ${APP_BASE_URL:-https://ransel.mietek.tech}
      DATABASE_URL: jdbc:postgresql://db:5432/ransel
      DATABASE_USER: ransel
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://ransel.mietek.tech}
      # Explore AI. Blank keys = Explore answers 503 AI_UNAVAILABLE, the rest of the API is unaffected.
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.5-flash}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-gemini-flash-latest}
      PLACES_API_KEY: ${PLACES_API_KEY:-}
      # App/Universal Links verification files (served at /.well-known/); empty = 404
      ANDROID_PACKAGE: ${ANDROID_PACKAGE:-app.ransel}
      ANDROID_CERT_SHA256: ${ANDROID_CERT_SHA256:-}
      IOS_APP_IDS: ${IOS_APP_IDS:-}
      # Closed beta until an email provider exists: no sign-up, one seeded account.
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}
      SEED_USER_NAME: ${SEED_USER_NAME:-Test User}
      # More accounts: email|password|name;email|password|name
      SEED_USERS: ${SEED_USERS:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ransel
      POSTGRES_USER: ransel
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
    volumes:
      - ransel-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ransel"]
      interval: 10s
      retries: 10

volumes:
  ransel-db:
