org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3g
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.native.ignoreDisabledTargets=true

# Where the Android app finds the API (BuildConfig.API_ORIGIN) is set per build type in composeApp/build.gradle.kts:
# debug -> https://ranselapi-dev.mietek.tech (staging), release -> https://ranselapi.mietek.tech. For the emulator against
# a local server pass -Pransel.apiOrigin.debug=http://10.0.2.2:8080 (or put it in ~/.gradle/gradle.properties).
