org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3g
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.native.ignoreDisabledTargets=true

# Where the Android app finds the API (BuildConfig.API_ORIGIN). Deployed API by default; for the emulator against a
# local server use -Pransel.apiOrigin=http://10.0.2.2:8080 or set it in ~/.gradle/gradle.properties.
ransel.apiOrigin=https://ranselapi.mietek.tech
