# Development database. Production lives in docker-compose.prod.yml (B2.9).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ransel
      POSTGRES_USER: ransel
      POSTGRES_PASSWORD: ransel
    ports:
      - "5432:5432"
    volumes:
      - ransel-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ransel"]
      interval: 5s
      retries: 10

volumes:
  ransel-db:
