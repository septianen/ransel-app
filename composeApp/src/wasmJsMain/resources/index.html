<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Deep links such as /j/<code> are served index.html too; without this the script and .wasm load from /j/. -->
    <base href="/">
    <title>RANSEL</title>
    <!-- Fallback link preview for any page; nginx gives crawlers a per-link page for /j/ and /p/ instead (OgRoutes).
         Crawlers need an absolute image URL, and staging and production share this file: the production image. -->
    <meta name="description" content="Rencanakan trip bareng: itinerary, packing, dan patungan.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="RANSEL">
    <meta property="og:title" content="RANSEL">
    <meta property="og:description" content="Rencanakan trip bareng: itinerary, packing, dan patungan.">
    <meta property="og:image" content="https://ransel.mietek.tech/og/invite.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <!-- Installable web app (PWA): manifest, icons and the service worker in sw.js. -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#008808">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="RANSEL">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <style>html, body { margin: 0; height: 100%; overflow: hidden; background: #FFFFFF; }</style>
    <script>
        // Language picked in Akun -> Bahasa (LocalStoragePreferences "ransel.language"). The app's strings follow the
        // browser language, so a choice other than "Ikuti sistem" stands in for it before the app loads; changing it
        // reloads the page (Locale.wasmJs.kt).
        (() => {
            let tag = null;
            try { tag = { INDONESIAN: 'id', ENGLISH: 'en' }[localStorage.getItem('ransel.language')] || null; } catch (e) {}
            window.RANSEL_LANGUAGE_TAG = tag;
            if (!tag) return;
            Object.defineProperty(navigator, 'languages', { get: () => [tag], configurable: true });
            Object.defineProperty(navigator, 'language', { get: () => tag, configurable: true });
            document.documentElement.lang = tag;
        })();
        // The web app and the API live on different hosts when deployed (production and staging use the same build);
        // locally the app finds the API on its own.
        const deployedApi = {
            'ransel.mietek.tech': 'https://ranselapi.mietek.tech',
            'ransel-dev.mietek.tech': 'https://ranselapi-dev.mietek.tech',
        }[location.hostname];
        if (deployedApi) window.RANSEL_API_ORIGIN = deployedApi;
        // The service worker runs on the deployed hosts only, so the dev server (localhost:8081) is never cached.
        // Add ?sw to a local URL to try it against a production build.
        if ('serviceWorker' in navigator && (deployedApi || new URLSearchParams(location.search).has('sw'))) {
            window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
        }
    </script>
    <script type="module">
        // Google Analytics for Firebase, production host only (staging, localhost and the dev server send nothing).
        // The web config is public client config, not a secret: Firebase console -> Project settings -> Your apps ->
        // Web app. Until appId and measurementId are filled in, window.ranselAnalytics stays undefined (WebAnalytics.kt).
        const firebaseConfig = {
            apiKey: '',
            authDomain: 'sen-katarina-project.firebaseapp.com',
            projectId: 'sen-katarina-project',
            appId: '',
            measurementId: '',
        };
        if (location.hostname === 'ransel.mietek.tech' && firebaseConfig.appId && firebaseConfig.measurementId) {
            const { initializeApp } = await import('https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js');
            const { getAnalytics, logEvent, setUserId, setUserProperties } = await import('https://www.gstatic.com/firebasejs/11.0.2/firebase-analytics.js');
            const analytics = getAnalytics(initializeApp(firebaseConfig));
            window.ranselAnalytics = {
                event: (name, params) => logEvent(analytics, name, params),
                screen: (name) => logEvent(analytics, 'screen_view', { firebase_screen: name, firebase_screen_class: name }),
                user: (id) => setUserId(analytics, id),
                property: (name, value) => setUserProperties(analytics, { [name]: value }),
            };
        }
    </script>
    <script src="composeApp.js"></script>
</head>
<body></body>
</html>
