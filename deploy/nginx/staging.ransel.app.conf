# Staging web app (API api-staging.ransel.app, port 8090), kept out of search engines. Copy to /etc/nginx/sites-available/staging.ransel.app, symlink into sites-enabled, then:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d staging.ransel.app      # adds the 443 block and the http->https redirect
# .app is on the HSTS preload list: browsers only ever ask over HTTPS, so the certificate must exist before the app links here.
server {
    listen 80;
    listen [::]:80;
    add_header X-Robots-Tag "noindex, nofollow" always;
    server_name staging.ransel.app;

    # Domain verification for App Links / Universal Links is answered by the API (values come from its env).
    location /.well-known/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # The web app (Compose Wasm build). Every other path, including /j/<code> and /p/<code>, falls back to index.html.
    root /opt/ransel-dev/web;
    index index.html;

    # The Wasm files are 4-9 MB and compress about 3x; the VPS link is slow at times (about 200 KB/s seen).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/wasm application/javascript text/css application/json application/manifest+json font/ttf application/octet-stream;

    # PWA: index.html and the service worker are always revalidated, so a deploy (new sw.js build id) reaches
    # installed apps on their next launch. Older nginx mime.types do not know .webmanifest.
    location = /index.html {
        add_header Cache-Control "no-cache"; add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache"; add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache"; add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # .wasm names are content hashes: cache for a year. composeApp.js and fonts keep their names (default caching).
    location ~* \.wasm$ {
        add_header Cache-Control "public, max-age=31536000, immutable"; add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # Shared links: link-preview crawlers get a small HTML page with Open Graph tags from the API (needs
    # ransel-preview-bots.conf in conf.d); people get the web app as usual.
    location ~ ^/(p|j)/[A-Za-z0-9_-]+/?$ {
        # used only when the request is proxied (proxy_set_header is not allowed inside "if")
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        if ($ransel_preview_bot) {
            rewrite ^/(p|j)/([A-Za-z0-9_-]+)/?$ /api/v1/og/$1/$2 break;
            proxy_pass http://127.0.0.1:8090;
        }
        try_files /index.html =404;
    }

    # Static preview images (the web build ships them in og/).
    location /og/ {
        add_header Cache-Control "public, max-age=86400"; add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
