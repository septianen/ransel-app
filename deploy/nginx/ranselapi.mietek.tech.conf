# Copy to /etc/nginx/sites-available/ranselapi.mietek.tech, symlink into sites-enabled, then:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ranselapi.mietek.tech      # adds the 443 block and the http->https redirect
# Other sites on this nginx are not touched.
server {
    listen 80;
    listen [::]:80;
    server_name ranselapi.mietek.tech;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite, never append: the server rate-limits logins by this address, so a client must not be
        # able to choose it by sending its own X-Forwarded-For.
        proxy_set_header X-Forwarded-For $remote_addr;
        # An Explore search waits for Gemini (up to 2 x 50 s) and Places before the first byte: 60 s cut it off with a 504.
        # Keep in step with the app's search timeout (RanselApi.kt) and the server's LLM timeouts.
        proxy_read_timeout 120s;
    }
}
