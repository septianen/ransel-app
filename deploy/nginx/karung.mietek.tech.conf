# Karung, the admin web app (static Wasm build). Copy to /etc/nginx/sites-available/karung.mietek.tech, symlink into
# sites-enabled, then:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d karung.mietek.tech
# The API must allow this origin: ADMIN_APP_ORIGIN=https://karung.mietek.tech in the server .env (admin-spec "API").
server {
    listen 80;
    listen [::]:80;
    server_name karung.mietek.tech;

    root /opt/ransel/karung;
    index index.html;

    # Internal tool: keep it out of search engines and never cache index.html, so a deploy shows up at once.
    add_header X-Robots-Tag "noindex, nofollow" always;
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
