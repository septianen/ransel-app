# Karung, the admin web app (static Wasm build). Copy to /etc/nginx/sites-available/karung.mietek.tech, symlink into
# sites-enabled, then:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d karung.mietek.tech
# The API must allow this origin: ADMIN_APP_ORIGIN=https://karung.mietek.tech in the server .env (admin-spec "API").
server {
    listen 80;
    listen [::]:80;
    server_name karung.mietek.tech;

    root /opt/ransel/karung;
    index index.html;

    # The Wasm files are 4-9 MB and compress about 3x; the VPS link is slow at times (about 200 KB/s seen).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/wasm application/javascript text/css application/json font/ttf application/octet-stream;

    # Internal tool: keep it out of search engines and never cache index.html, so a deploy shows up at once.
    add_header X-Robots-Tag "noindex, nofollow" always;
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # .wasm names are content hashes, so a file never changes: browsers keep it for a year. adminApp.js and the fonts
    # keep their names across builds, so they are revalidated (default caching).
    location ~* \.wasm$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
