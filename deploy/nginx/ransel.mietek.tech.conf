# Web app + invite links. Copy to /etc/nginx/sites-available/ransel.mietek.tech, symlink into sites-enabled, then:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ransel.mietek.tech
server {
    listen 80;
    listen [::]:80;
    server_name ransel.mietek.tech;

    # Domain verification for App Links / Universal Links is answered by the API (values come from its env).
    location /.well-known/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # The web app (Compose Wasm build). Every other path, including /j/<code>, falls back to index.html.
    root /opt/ransel/web;
    index index.html;

    # The Wasm files are 4-9 MB and compress about 3x; the VPS link is slow at times (about 200 KB/s seen).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/wasm application/javascript text/css application/json application/manifest+json font/ttf application/octet-stream;

    # PWA: index.html and the service worker are always revalidated, so a deploy (new sw.js build id) reaches
    # installed apps on their next launch. Older nginx mime.types do not know .webmanifest.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # .wasm names are content hashes: cache for a year. composeApp.js and fonts keep their names (default caching).
    location ~* \.wasm$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
