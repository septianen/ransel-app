# Link-preview crawlers (WhatsApp, Telegram, Facebook, X, Slack, Discord, LinkedIn). Shared by ransel.mietek.tech and
# ransel-dev.mietek.tech: copy once to /etc/nginx/conf.d/ransel-preview-bots.conf (http level), then
#   sudo nginx -t && sudo systemctl reload nginx
map $http_user_agent $ransel_preview_bot {
    default 0;
    ~*(WhatsApp|facebookexternalhit|Facebot|TelegramBot|Twitterbot|Slackbot|Discordbot|LinkedInBot|SkypeUriPreview|Googlebot) 1;
}
