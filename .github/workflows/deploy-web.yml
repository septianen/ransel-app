name: Deploy web

# Builds the Compose web (wasmJs) app and publishes it to the folder nginx serves it from.
# Uses the SSH secrets listed in deploy/README.md (same as Deploy server).
#   production  push to main            -> ransel.mietek.tech      /opt/ransel/web
#   staging     push to develop, or     -> ransel-dev.mietek.tech  /opt/ransel-dev/web
#               Run workflow on any branch with target "staging"
# The build is the same; index.html picks the API from the hostname.
on:
  push:
    branches: [main, develop]
    paths:
      - "composeApp/**"
      - "shared/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Where to deploy (production only from main)"
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy-web-${{ inputs.target || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}
    steps:
      - name: Target settings
        env:
          TARGET: ${{ inputs.target || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}
          # Staging has its own variable name, so a missing one never falls back to the production folder.
          PROD_DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          STAGING_DEPLOY_PATH: ${{ vars.STAGING_DEPLOY_PATH }}
        run: |
          if [ "$TARGET" = production ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then echo "production deploys only from main" >&2; exit 1; fi
            echo "DEPLOY_PATH=${PROD_DEPLOY_PATH:-/opt/ransel}" >> "$GITHUB_ENV"
            echo "SITE=https://ransel.mietek.tech/" >> "$GITHUB_ENV"
          else
            echo "DEPLOY_PATH=${STAGING_DEPLOY_PATH:-/opt/ransel-dev}" >> "$GITHUB_ENV"
            echo "SITE=https://ransel-dev.mietek.tech/" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept Android licenses (the build configures the Android plugin)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build web distribution
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --no-daemon

      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Publish
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          DIST=composeApp/build/dist/wasmJs/productionExecutable
          test -f "$DIST/index.html" || { echo "no web build in $DIST" >&2; exit 1; }

          SSH_OPTS="-p $PORT -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes"
          SSH="ssh $SSH_OPTS $DEPLOY_USER@$HOST"
          WEB="$DEPLOY_PATH/web"

          # Upload into web.new next to the live folder (seeded from it, so rsync only sends what changed),
          # then swap the two folders, so visitors never load a half-uploaded app.
          $SSH "rm -rf '$WEB.new' '$WEB.old' && mkdir -p '$WEB' && cp -a '$WEB' '$WEB.new'"
          rsync -a --delete --chmod=D755,F644 -e "ssh $SSH_OPTS" "$DIST/" "$DEPLOY_USER@$HOST:$WEB.new/"
          $SSH "mv '$WEB' '$WEB.old' && mv '$WEB.new' '$WEB' && rm -rf '$WEB.old'"

      - name: Check the site answers
        run: curl -fsS -o /dev/null "$SITE"
