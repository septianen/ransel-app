name: Deploy web

# Builds the Compose web (wasmJs) app and publishes it to the folder nginx serves it from.
# Uses the SSH secrets listed in deploy/README.md (same as Deploy server).
# Production only when Release calls this with production: true.
# github.event_name inside this file is the caller's event, so it is not a workflow_call signal.
# A push, including to main, and Run workflow deploy staging. The build is the same; index.html
# picks the API from the hostname.
#   production  Release workflow (RELEASE_TYPE set)  -> ransel.app          /opt/ransel/web
#   staging     push to main or develop, or          -> staging.ransel.app  /opt/ransel-dev/web
#               Run workflow, or Release with none
on:
  push:
    branches: [main, develop]
    paths:
      - "composeApp/**"
      - "shared/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      production:
        description: "true deploys production from ref. false deploys staging."
        type: boolean
        required: false
        default: false
      ref:
        description: "Commit to build. Required when production is true (the bumped SHA)."
        type: string
        required: false
        default: ""

concurrency:
  group: ${{ inputs.production && 'deploy-web-production' || 'deploy-web-staging' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.production && 'production' || 'staging' }}
    steps:
      - name: Target settings
        env:
          PRODUCTION: ${{ inputs.production }}
          DEPLOY_REF: ${{ inputs.ref }}
          # Staging has its own variable name, so a missing one never falls back to the production folder.
          PROD_DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          STAGING_DEPLOY_PATH: ${{ vars.STAGING_DEPLOY_PATH }}
        run: |
          # production is the boolean Release passes. A push leaves it false, so this stays on staging.
          if [ "$PRODUCTION" = true ]; then
            if [ -z "$DEPLOY_REF" ]; then
              echo "::error::production deploy requires the bumped commit SHA from prepare" >&2
              exit 1
            fi
            TARGET=production
            REF="$DEPLOY_REF"
          else
            TARGET=staging
            REF="${DEPLOY_REF:-$GITHUB_SHA}"
          fi
          echo "DEPLOY_SHA=$REF" >> "$GITHUB_ENV"
          if [ "$TARGET" = production ]; then
            echo "DEPLOY_PATH=${PROD_DEPLOY_PATH:-/opt/ransel}" >> "$GITHUB_ENV"
            echo "SITE=https://ransel.app/" >> "$GITHUB_ENV"
          else
            echo "DEPLOY_PATH=${STAGING_DEPLOY_PATH:-/opt/ransel-dev}" >> "$GITHUB_ENV"
            echo "SITE=https://staging.ransel.app/" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept Android licenses (the build configures the Android plugin)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build web distribution
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --no-daemon

      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Publish
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          DIST=composeApp/build/dist/wasmJs/productionExecutable
          test -f "$DIST/index.html" || { echo "no web build in $DIST" >&2; exit 1; }

          SSH_OPTS="-p $PORT -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes"
          SSH="ssh $SSH_OPTS $DEPLOY_USER@$HOST"
          WEB="$DEPLOY_PATH/web"

          # Upload into web.new next to the live folder (seeded from it, so rsync only sends what changed),
          # then swap the two folders, so visitors never load a half-uploaded app.
          $SSH "rm -rf '$WEB.new' '$WEB.old' && mkdir -p '$WEB' && cp -a '$WEB' '$WEB.new'"
          rsync -a --delete --chmod=D755,F644 -e "ssh $SSH_OPTS" "$DIST/" "$DEPLOY_USER@$HOST:$WEB.new/"
          $SSH "mv '$WEB' '$WEB.old' && mv '$WEB.new' '$WEB' && rm -rf '$WEB.old'"

      - name: Check the site answers
        run: curl -fsS -o /dev/null "$SITE"
