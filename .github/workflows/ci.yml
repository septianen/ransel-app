name: CI

# Pull requests into develop. Tests only: the same job as "Deploy server", without the rollout.
on:
  pull_request:
    branches: [develop]
    paths:
      - "server/**"
      - "shared/**"
      - "composeApp/**"
      - "adminApp/**"
      - "iris/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "version.properties"
      - "scripts/**"
      - ".github/workflows/**"

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 21, not 17: Robolectric loads the debug manifest, and Chucker (debug only) is compiled for 21.
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Version bump tests
        run: python3 -m unittest discover -s scripts -p 'test_bump_version.py' -v
      - name: Accept Android licenses (the :shared module configures the Android plugin)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Shared, server, and receipt form tests (Testcontainers uses the runner's Docker)
        run: ./gradlew :shared:jvmTest :server:test --no-daemon
      - name: App update and Karung tests
        run: |
          export CHROME_BIN="$(which google-chrome)"
          ./gradlew :composeApp:testDebugUnitTest --tests app.ransel.feature.ReceiptTest --tests app.ransel.feature.AppUpdateTest --tests app.ransel.feature.SoftUpdateDialogTest :adminApp:wasmJsBrowserTest --no-daemon
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files = glob.glob('composeApp/build/test-results/testDebugUnitTest/TEST-app.ransel.feature.AppUpdateTest.xml')
          files += glob.glob('composeApp/build/test-results/testDebugUnitTest/TEST-app.ransel.feature.SoftUpdateDialogTest.xml')
          files += glob.glob('adminApp/build/test-results/**/TEST-*.xml', recursive=True)
          if not files:
              raise SystemExit('App update or Karung tests did not produce results')
          for f in sorted(files):
              suite = ET.parse(f).getroot()
              print(f"RAN {suite.get('name')} tests={suite.get('tests')} failures={suite.get('failures')}")
              for case in suite.iter('testcase'):
                  print(f"  {case.get('classname')} > {case.get('name')}")
          PY
      - name: Failed tests as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('server/build/test-results/test/*.xml') + glob.glob('shared/build/test-results/jvmTest/*.xml') + glob.glob('composeApp/build/test-results/testDebugUnitTest/*.xml') + glob.glob('adminApp/build/test-results/**/*.xml', recursive=True):
              suite = ET.parse(f).getroot()
              for case in suite.iter('testcase'):
                  for kind in ('failure', 'error'):
                      e = case.find(kind)
                      if e is None: continue
                      text = ((e.get('message') or '') + '\n' + (e.text or ''))[:1500]
                      text = text.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                      print(f"::error title={suite.get('name').split('.')[-1]} > {case.get('name')}::{text}")
          PY
