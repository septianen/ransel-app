name: Distribute Android

# Builds the Android APK and uploads it to Firebase App Distribution, so testers get it in the App Tester app.
# Needs the secrets and variables in deploy/README.md "Android builds (Firebase App Distribution)".
#
#   staging     push to develop, or     -> debug build "RANSEL Dev" (app.ransel.debug) against ranselapi-dev.mietek.tech
#               Run workflow with target "staging" on any branch
#   production  push to main            -> release build (app.ransel, R8, signed) against ranselapi.mietek.tech
on:
  push:
    branches: [main, develop]
    paths:
      - "composeApp/**"
      - "iris/**"
      - "shared/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/distribute-android.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Which build (production only from main)"
        type: choice
        options: [staging, production]
        default: staging
      release_notes:
        description: "Release notes for testers (default: the commit message)"
        type: string
        required: false

concurrency:
  group: distribute-android-${{ inputs.target || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
      - name: Target settings
        env:
          TARGET: ${{ inputs.target || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}
          APP_ID_RELEASE: ${{ vars.FIREBASE_APP_ID_RELEASE }}
          APP_ID_DEBUG: ${{ vars.FIREBASE_APP_ID_DEBUG }}
        run: |
          if [ "$TARGET" = production ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then echo "production builds only from main" >&2; exit 1; fi
            echo "BUILD_TYPE=release" >> "$GITHUB_ENV"
            echo "APK=composeApp/build/outputs/apk/release/composeApp-release.apk" >> "$GITHUB_ENV"
            echo "FIREBASE_APP_ID=$APP_ID_RELEASE" >> "$GITHUB_ENV"
          else
            echo "BUILD_TYPE=debug" >> "$GITHUB_ENV"
            echo "APK=composeApp/build/outputs/apk/debug/composeApp-debug.apk" >> "$GITHUB_ENV"
            echo "FIREBASE_APP_ID=$APP_ID_DEBUG" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Firebase config and signing keys
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          RELEASE_KEYSTORE: ${{ secrets.RANSEL_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          # Decodes a base64 secret into a file. Line breaks and spaces (Windows clipboard, wrapped output) are ignored,
          # and a bad value names its secret instead of a bare "base64: invalid input".
          decode() {
            if ! printf '%s' "$1" | tr -d ' \t\r\n' | base64 -d > "$2" 2>/dev/null; then
              echo "::error::$3 is not valid base64. Paste the output of: base64 -w0 <file> (PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes(\"<file>\")))"
              exit 1
            fi
          }
          # google-services.json turns on push, Analytics and Crashlytics; without it they are off in the build.
          # The secret may hold the file as is or as base64.
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            case "$(printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d ' \t\r\n' | head -c 1)" in
              "{") printf '%s' "$GOOGLE_SERVICES_JSON" > composeApp/google-services.json ;;
              *) decode "$GOOGLE_SERVICES_JSON" composeApp/google-services.json GOOGLE_SERVICES_JSON ;;
            esac
            if ! packages=$(python3 -c 'import json,sys; print(", ".join(c["client_info"]["android_client_info"]["package_name"] for c in json.load(open(sys.argv[1]))["client"]))' composeApp/google-services.json 2>/dev/null); then
              echo "::error::GOOGLE_SERVICES_JSON is not a google-services.json file (download it from Firebase -> Project settings -> Your apps)"
              exit 1
            fi
            echo "google-services.json packages: $packages"
          else
            echo "::warning::GOOGLE_SERVICES_JSON is not set: the APK has no push, Analytics or Crashlytics"
          fi
          if [ "$BUILD_TYPE" = release ]; then
            if [ -z "$RELEASE_KEYSTORE" ]; then echo "RANSEL_KEYSTORE_BASE64 is not set: a release build must be signed" >&2; exit 1; fi
            decode "$RELEASE_KEYSTORE" "$RUNNER_TEMP/ransel-release.jks" RANSEL_KEYSTORE_BASE64
            echo "RANSEL_KEYSTORE_FILE=$RUNNER_TEMP/ransel-release.jks" >> "$GITHUB_ENV"
          elif [ -n "$DEBUG_KEYSTORE" ]; then
            # The same debug key every run, or testers could not update over the previous build.
            mkdir -p ~/.android
            decode "$DEBUG_KEYSTORE" ~/.android/debug.keystore DEBUG_KEYSTORE_BASE64
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 is not set: each build has a new debug key and must be reinstalled"
          fi

      - name: Build APK
        env:
          RANSEL_KEYSTORE_PASSWORD: ${{ secrets.RANSEL_KEYSTORE_PASSWORD }}
          RANSEL_KEY_ALIAS: ${{ secrets.RANSEL_KEY_ALIAS }}
          RANSEL_KEY_PASSWORD: ${{ secrets.RANSEL_KEY_PASSWORD }}
        run: |
          # versionCode = this workflow's run number: it only goes up (debug and release share it), which Google Play
          # requires. Renaming or recreating this workflow file restarts the count, so keep its name.
          TYPE="$(echo "${BUILD_TYPE:0:1}" | tr a-z A-Z)${BUILD_TYPE:1}"
          TASKS=":composeApp:assemble$TYPE"
          # Release also builds the App Bundle (AAB) for Google Play, signed with the same (upload) key.
          if [ "$BUILD_TYPE" = release ]; then TASKS="$TASKS :composeApp:bundleRelease"; fi
          ./gradlew $TASKS -Pransel.versionCode=${{ github.run_number }} --no-daemon
          test -f "$APK" || { echo "no APK at $APK" >&2; ls -R composeApp/build/outputs/apk >&2; exit 1; }
          if [ "$BUILD_TYPE" = release ]; then
            test -f composeApp/build/outputs/bundle/release/composeApp-release.aab || { echo "no AAB" >&2; exit 1; }
            test -f composeApp/build/outputs/mapping/release/mapping.txt || { echo "no R8 mapping.txt" >&2; exit 1; }
          fi

      - name: Check permissions and 16 KB page alignment
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "Permissions in the APK (versionCode ${{ github.run_number }}):"
          "$BT/aapt2" dump permissions "$APK" | tee "$RUNNER_TEMP/permissions.txt"
          # No ads: Play Console is told the app uses no advertising ID (composeApp AndroidManifest.xml removes it).
          if grep -E 'AD_ID|ACCESS_ADSERVICES' "$RUNNER_TEMP/permissions.txt"; then
            echo "::error::The APK asks for an advertising-ID permission"; exit 1
          fi
          # Android 15+ devices with 16 KB pages: native libraries must be stored uncompressed on 16 KB boundaries.
          "$BT/zipalign" -c -P 16 -v 4 "$APK" > "$RUNNER_TEMP/zipalign.txt" || { grep -v 'OK' "$RUNNER_TEMP/zipalign.txt"; echo "::error::Native libraries are not 16 KB aligned"; exit 1; }
          grep '\.so' "$RUNNER_TEMP/zipalign.txt" || true

      - uses: actions/upload-artifact@v4
        with:
          name: ransel-${{ env.BUILD_TYPE }}-${{ github.run_number }}
          path: ${{ env.APK }}
          retention-days: 14

      # For Google Play: upload the AAB in Play Console (closed testing), and mapping.txt under App bundle explorer ->
      # Downloads -> ReTrace mapping file if Play does not take it from the bundle (Crashlytics gets it from the build).
      - uses: actions/upload-artifact@v4
        if: env.BUILD_TYPE == 'release'
        with:
          name: ransel-play-${{ github.run_number }}
          path: |
            composeApp/build/outputs/bundle/release/composeApp-release.aab
            composeApp/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Upload to Firebase App Distribution
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_DISTRIBUTION_SERVICE_ACCOUNT }}
          GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'testers' }}
          NOTES: ${{ inputs.release_notes }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$FIREBASE_APP_ID" ]; then echo "::error::The Firebase app id variable for $BUILD_TYPE is empty (deploy/README.md)"; exit 1; fi
          if [ -z "$SERVICE_ACCOUNT" ]; then echo "::error::FIREBASE_DISTRIBUTION_SERVICE_ACCOUNT is empty (deploy/README.md)"; exit 1; fi
          # the key file pasted as is, or base64
          case "$SERVICE_ACCOUNT" in
            "{"*) printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json" ;;
            *) printf '%s' "$SERVICE_ACCOUNT" | base64 -d > "$RUNNER_TEMP/firebase-sa.json" ;;
          esac
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          # the commit message without its trailers (Co-Authored-By, ...)
          NOTES="${NOTES:-$(printf '%s\n' "${COMMIT_MESSAGE:-manual build}" | grep -v -E '^[A-Za-z-]+: ' )}"
          printf '%s\n\n%s #%s, %s\n' "$NOTES" "${GITHUB_REF_NAME}" "${{ github.run_number }}" "${GITHUB_SHA::7}" > "$RUNNER_TEMP/notes.txt"
          # Firebase's own message becomes an annotation, so the reason shows on the run page.
          set +e
          npx --yes firebase-tools@14 appdistribution:distribute "$APK" \
            --app "$FIREBASE_APP_ID" \
            --groups "$GROUPS" \
            --release-notes-file "$RUNNER_TEMP/notes.txt" 2>&1 | tee "$RUNNER_TEMP/firebase.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=Firebase App Distribution::$(grep -iE 'error|denied|permission|not found|invalid|disabled' "$RUNNER_TEMP/firebase.log" | tail -5 | tr '\n' ' ')"
            exit "$status"
          fi
