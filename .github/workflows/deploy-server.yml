name: Deploy server

# Builds the server distribution, pushes the image to GHCR and rolls it out on the VPS over SSH.
# Needs the repository secrets listed in deploy/README.md.
#
# Two targets on the same VPS (deploy/README.md "Staging"):
#   production  push to main            -> ranselapi.mietek.tech      /opt/ransel      127.0.0.1:8080
#   staging     push to develop, or     -> ranselapi-dev.mietek.tech  /opt/ransel-dev  127.0.0.1:8090
#               Run workflow on any branch with target "staging"
# The deploy job runs in the GitHub Environment of the target; staging's own secrets there override the repository ones.
on:
  push:
    branches: [main, develop]
    paths:
      - "server/**"
      - "shared/**"
      - "docker-compose.prod.yml"
      - "deploy/**"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Where to deploy (production only from main)"
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy-server-${{ inputs.target || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ransel-server

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept Android licenses (the :shared module configures the Android plugin)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Shared and server tests (Testcontainers uses the runner's Docker)
        run: ./gradlew :shared:jvmTest :server:test --no-daemon
      - name: Failed tests as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('server/build/test-results/test/*.xml') + glob.glob('shared/build/test-results/jvmTest/*.xml'):
              suite = ET.parse(f).getroot()
              for case in suite.iter('testcase'):
                  for kind in ('failure', 'error'):
                      e = case.find(kind)
                      if e is None: continue
                      text = ((e.get('message') or '') + '\n' + (e.text or ''))[:1500]
                      text = text.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                      print(f"::error title={suite.get('name').split('.')[-1]} > {case.get('name')}::{text}")
          PY

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ inputs.target || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}
    steps:
      - name: Target settings
        env:
          TARGET: ${{ inputs.target || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}
          # Staging uses its own variable names: a variable missing in the staging Environment would otherwise fall
          # back to the repository (production) value and deploy over production.
          PROD_DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          STAGING_DEPLOY_PATH: ${{ vars.STAGING_DEPLOY_PATH }}
          STAGING_SECRETS_SET: ${{ vars.STAGING_SECRETS_SET }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
        run: |
          if [ "$TARGET" = production ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then echo "production deploys only from main" >&2; exit 1; fi
            {
              echo "APP_ENV=production"
              echo "DEPLOY_PATH=${PROD_DEPLOY_PATH:-/opt/ransel}"
              echo "HOST_PORT=8080"
              echo "ANDROID_PACKAGE=app.ransel"
              echo "IMAGE_CHANNEL=latest"
              echo "APP_BASE_URL=https://ransel.mietek.tech"
              echo "CORS_ORIGINS=https://ransel.mietek.tech"
            } >> "$GITHUB_ENV"
          else
            # A secret missing in the staging Environment silently falls back to the production repository secret, and
            # Actions cannot tell which one we got. STAGING_SECRETS_SET=true is set by hand once JWT_SECRET,
            # PHOTO_SIGNING_SECRET and DATABASE_PASSWORD exist in the staging Environment (deploy/README.md "Staging").
            if [ "$STAGING_SECRETS_SET" != true ]; then
              echo "Set staging's own JWT_SECRET, PHOTO_SIGNING_SECRET, DATABASE_PASSWORD in the 'staging' Environment, then its variable STAGING_SECRETS_SET=true" >&2
              exit 1
            fi
            {
              echo "APP_ENV=staging"
              echo "DEPLOY_PATH=${STAGING_DEPLOY_PATH:-/opt/ransel-dev}"
              echo "HOST_PORT=8090"
              echo "ANDROID_PACKAGE=app.ransel.debug"
              echo "IMAGE_CHANNEL=staging"
              # The staging web app (Deploy web, target staging); APP_BASE_URL / CORS_ORIGINS in the staging
              # Environment override them.
              echo "APP_BASE_URL=${APP_BASE_URL:-https://ransel-dev.mietek.tech}"
              echo "CORS_ORIGINS=${CORS_ORIGINS:-https://ransel-dev.mietek.tech}"
            } >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build distribution
        run: ./gradlew :server:installDist --no-daemon

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.IMAGE_CHANNEL }}
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Roll out
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PHOTO_SIGNING_SECRET: ${{ secrets.PHOTO_SIGNING_SECRET }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          SEED_USER_EMAIL: ${{ secrets.SEED_USER_EMAIL }}
          SEED_USER_PASSWORD: ${{ secrets.SEED_USER_PASSWORD }}
          SEED_USER_NAME: ${{ secrets.SEED_USER_NAME }}
          SEED_USERS: ${{ secrets.SEED_USERS }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
          FCM_PROJECT_ID: ${{ vars.FCM_PROJECT_ID }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          # Sign-up is open unless the repository variable REGISTRATION_ENABLED is "false".
          REGISTRATION_ENABLED: ${{ vars.REGISTRATION_ENABLED }}
          # Outgoing email (verification, password reset): any provider's SMTP relay.
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          LLM_FALLBACK_MODEL: ${{ vars.LLM_FALLBACK_MODEL }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Public verification values. Read from a repository variable, or from a secret of the same name.
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 || secrets.ANDROID_CERT_SHA256 }}
          IOS_APP_IDS: ${{ vars.IOS_APP_IDS || secrets.IOS_APP_IDS }}
          # Admin app "Karung": repository variable ADMIN_EMAILS (comma separated). This file overwrites the VPS .env on
          # every deploy, so a value typed into .env by hand does not survive the next deploy.
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
          ADMIN_PASSWORD_RESET_ENABLED: ${{ vars.ADMIN_PASSWORD_RESET_ENABLED }}
          # Karung's "Server dan database" cost line, USD per month (repository variable).
          SERVER_MONTHLY_COST_USD: ${{ vars.SERVER_MONTHLY_COST_USD }}
        run: |
          SSH="ssh -p $PORT -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes $DEPLOY_USER@$HOST"
          SCP="scp -P $PORT -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes"

          $SSH "mkdir -p '$DEPLOY_PATH/deploy' '$DEPLOY_PATH/backups'"
          $SCP docker-compose.prod.yml "$DEPLOY_USER@$HOST:$DEPLOY_PATH/docker-compose.prod.yml"
          $SCP deploy/backup-db.sh "$DEPLOY_USER@$HOST:$DEPLOY_PATH/deploy/backup-db.sh"

          # The env file travels over stdin, so secrets never appear in a command line or in the log.
          {
            echo "SERVER_IMAGE=$IMAGE:${{ github.sha }}"
            echo "APP_ENV=$APP_ENV"
            echo "HOST_PORT=$HOST_PORT"
            echo "ANDROID_PACKAGE=$ANDROID_PACKAGE"
            echo "JWT_SECRET=$JWT_SECRET"
            echo "PHOTO_SIGNING_SECRET=$PHOTO_SIGNING_SECRET"
            echo "DATABASE_PASSWORD=$DATABASE_PASSWORD"
            echo "APP_BASE_URL=$APP_BASE_URL"
            echo "CORS_ORIGINS=$CORS_ORIGINS"
            echo "REGISTRATION_ENABLED=${REGISTRATION_ENABLED:-true}"
            echo "SMTP_HOST=$SMTP_HOST"
            echo "SMTP_PORT=${SMTP_PORT:-587}"
            echo "SMTP_USERNAME=$SMTP_USERNAME"
            echo "SMTP_PASSWORD=$SMTP_PASSWORD"
            echo "EMAIL_FROM=${EMAIL_FROM:-RANSEL <no-reply@mietek.tech>}"
            echo "ANDROID_CERT_SHA256=$ANDROID_CERT_SHA256"
            echo "IOS_APP_IDS=$IOS_APP_IDS"
            echo "SEED_USER_EMAIL=$SEED_USER_EMAIL"
            echo "SEED_USER_PASSWORD=$SEED_USER_PASSWORD"
            echo "SEED_USER_NAME=${SEED_USER_NAME:-Test User}"
            echo "SEED_USERS=$SEED_USERS"
            echo "LLM_API_KEY=$LLM_API_KEY"
            echo "PLACES_API_KEY=$PLACES_API_KEY"
            echo "FCM_PROJECT_ID=$FCM_PROJECT_ID"
            echo "FCM_SERVICE_ACCOUNT_JSON=$FCM_SERVICE_ACCOUNT_JSON"
            echo "LLM_MODEL=${LLM_MODEL:-gemini-3.1-flash-lite}"
            echo "LLM_FALLBACK_MODEL=${LLM_FALLBACK_MODEL:-gemini-3.5-flash}"
            echo "ADMIN_EMAILS=$ADMIN_EMAILS"
            echo "ADMIN_APP_ORIGIN=https://karung.mietek.tech"
            echo "ADMIN_PASSWORD_RESET_ENABLED=${ADMIN_PASSWORD_RESET_ENABLED:-false}"
            echo "SERVER_MONTHLY_COST_USD=$SERVER_MONTHLY_COST_USD"
          } | $SSH "umask 077 && cat > '$DEPLOY_PATH/.env'"

          printf '%s' "$GHCR_TOKEN" | $SSH "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          $SSH "cd '$DEPLOY_PATH' && chmod +x deploy/backup-db.sh && docker compose -f docker-compose.prod.yml pull server && docker compose -f docker-compose.prod.yml up -d && docker image prune -f"

      - name: Wait for health
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          for i in $(seq 1 30); do
            if ssh -p "$PORT" -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes "$DEPLOY_USER@$HOST" \
                  "curl -fsS http://127.0.0.1:$HOST_PORT/api/v1/health" ; then echo; exit 0; fi
            sleep 3
          done
          echo "server did not become healthy" >&2
          exit 1
