name: Deploy server

# Builds the server distribution, pushes the image to GHCR and rolls it out on the VPS over SSH.
# Needs the repository secrets listed in deploy/README.md.
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "shared/**"
      - "docker-compose.prod.yml"
      - "deploy/**"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ransel-server

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept Android licenses (the :shared module configures the Android plugin)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Shared and server tests (Testcontainers uses the runner's Docker)
        run: ./gradlew :shared:jvmTest :server:test --no-daemon

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build distribution
        run: ./gradlew :server:installDist --no-daemon

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Roll out
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/ransel' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PHOTO_SIGNING_SECRET: ${{ secrets.PHOTO_SIGNING_SECRET }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          SEED_USER_EMAIL: ${{ secrets.SEED_USER_EMAIL }}
          SEED_USER_PASSWORD: ${{ secrets.SEED_USER_PASSWORD }}
          SEED_USER_NAME: ${{ secrets.SEED_USER_NAME }}
          SEED_USERS: ${{ secrets.SEED_USERS }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_FALLBACK_MODEL: ${{ vars.LLM_FALLBACK_MODEL }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Public verification values. Read from a repository variable, or from a secret of the same name.
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 || secrets.ANDROID_CERT_SHA256 }}
          IOS_APP_IDS: ${{ vars.IOS_APP_IDS || secrets.IOS_APP_IDS }}
        run: |
          SSH="ssh -p $PORT -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes $DEPLOY_USER@$HOST"
          SCP="scp -P $PORT -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes"

          $SSH "mkdir -p '$DEPLOY_PATH/deploy' '$DEPLOY_PATH/backups'"
          $SCP docker-compose.prod.yml "$DEPLOY_USER@$HOST:$DEPLOY_PATH/docker-compose.prod.yml"
          $SCP deploy/backup-db.sh "$DEPLOY_USER@$HOST:$DEPLOY_PATH/deploy/backup-db.sh"

          # The env file travels over stdin, so secrets never appear in a command line or in the log.
          {
            echo "SERVER_IMAGE=$IMAGE:${{ github.sha }}"
            echo "JWT_SECRET=$JWT_SECRET"
            echo "PHOTO_SIGNING_SECRET=$PHOTO_SIGNING_SECRET"
            echo "DATABASE_PASSWORD=$DATABASE_PASSWORD"
            echo "APP_BASE_URL=https://ransel.mietek.tech"
            echo "CORS_ORIGINS=https://ransel.mietek.tech"
            echo "REGISTRATION_ENABLED=false"
            echo "ANDROID_CERT_SHA256=$ANDROID_CERT_SHA256"
            echo "IOS_APP_IDS=$IOS_APP_IDS"
            echo "SEED_USER_EMAIL=$SEED_USER_EMAIL"
            echo "SEED_USER_PASSWORD=$SEED_USER_PASSWORD"
            echo "SEED_USER_NAME=${SEED_USER_NAME:-Test User}"
            echo "SEED_USERS=$SEED_USERS"
            echo "LLM_API_KEY=$LLM_API_KEY"
            echo "PLACES_API_KEY=$PLACES_API_KEY"
            echo "LLM_MODEL=${LLM_MODEL:-gemini-3.1-flash-lite}"
            echo "LLM_FALLBACK_MODEL=${LLM_FALLBACK_MODEL:-gemini-3.5-flash}"
          } | $SSH "umask 077 && cat > '$DEPLOY_PATH/.env'"

          printf '%s' "$GHCR_TOKEN" | $SSH "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          $SSH "cd '$DEPLOY_PATH' && chmod +x deploy/backup-db.sh && docker compose -f docker-compose.prod.yml pull server && docker compose -f docker-compose.prod.yml up -d && docker image prune -f"

      - name: Wait for health
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          for i in $(seq 1 30); do
            if ssh -p "$PORT" -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes "$DEPLOY_USER@$HOST" \
                 'curl -fsS http://127.0.0.1:8080/api/v1/health' ; then echo; exit 0; fi
            sleep 3
          done
          echo "server did not become healthy" >&2
          exit 1
