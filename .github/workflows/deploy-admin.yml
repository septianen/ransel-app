name: Deploy admin

# Builds Karung, the admin web app (adminApp, wasmJs), and publishes it to the folder nginx serves karung.ransel.app from.
# Uses the SSH secrets listed in deploy/README.md (same as Deploy server).
# Karung is production. It deploys only when the Release workflow calls this with release_type set.
# A push does not publish it, and Run workflow refuses rather than deploying.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_type:
        description: "MAJOR, MINOR or PATCH. Empty does not deploy."
        type: string
        required: false
        default: ""
      ref:
        description: "Commit to build. Empty uses the event SHA."
        type: string
        required: false
        default: ""

concurrency:
  group: deploy-admin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refuse-manual:
    if: github.event_name != 'workflow_call'
    runs-on: ubuntu-latest
    steps:
      - name: Production only from Release
        run: |
          echo "::error::Karung deploys with a production release. Actions -> Release -> Run workflow on main, RELEASE_TYPE MAJOR, MINOR or PATCH."
          exit 1

  deploy:
    if: github.event_name == 'workflow_call' && (inputs.release_type == 'MAJOR' || inputs.release_type == 'MINOR' || inputs.release_type == 'PATCH')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept Android licenses (the build configures the Android plugin)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build admin distribution
        run: ./gradlew :adminApp:wasmJsBrowserDistribution --no-daemon

      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Publish
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/ransel' }}
        run: |
          DIST=adminApp/build/dist/wasmJs/productionExecutable
          test -f "$DIST/index.html" || { echo "no admin build in $DIST" >&2; exit 1; }

          SSH_OPTS="-p $PORT -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes"
          SSH="ssh $SSH_OPTS $DEPLOY_USER@$HOST"
          WEB="$DEPLOY_PATH/karung"

          # Upload into web.new next to the live folder (seeded from it, so rsync only sends what changed),
          # then swap the two folders, so visitors never load a half-uploaded app.
          $SSH "rm -rf '$WEB.new' '$WEB.old' && mkdir -p '$WEB' && cp -a '$WEB' '$WEB.new'"
          rsync -a --delete --chmod=D755,F644 -e "ssh $SSH_OPTS" "$DIST/" "$DEPLOY_USER@$HOST:$WEB.new/"
          $SSH "mv '$WEB' '$WEB.old' && mv '$WEB.new' '$WEB' && rm -rf '$WEB.old'"

      - name: Check the site answers
        run: curl -fsS -o /dev/null https://karung.ransel.app/
