<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Detail tempat: memuat</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400..600,0..1,0&amp;display=block">
<style>
body{margin:0;--surface:#FFFFFF;--card:#FFFFFF;--card-alt:#F3F3F3;--text:#1B1B1B;--muted:#525252;--line:#E2E2E2;--ai-bg:#ffe6ff;--ai-text:#7c2d92;--link:#008808;--skel:#E8E8E8;}
.ic{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;line-height:1;display:inline-block;font-variation-settings:"FILL" 0,"wght" 500,"GRAD" 0,"opsz" 24;font-feature-settings:"liga";-webkit-font-smoothing:antialiased}
.fill{font-variation-settings:"FILL" 1,"wght" 500,"GRAD" 0,"opsz" 24}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: var(--surface); color: var(--text); font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">

  <div style="flex-grow: 1; overflow-y: auto;">
    <!-- One photo (the same one as on the swipe card, so no extra Google request when it is already cached). -->
    <div style="position: relative; height: 300px; background: #00A896; overflow: hidden;" role="img" aria-label="Foto Air Terjun Tegenungan">
      <div style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: var(--skel);"></div>
      <div style="position: absolute; left: 0; right: 0; top: 0; height: 96px; background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0));"></div>
      <a href="Swipe.dc.html" aria-label="Kembali" style="position: absolute; left: 8px; top: 8px; width: 48px; height: 48px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.35); color: #FFFFFF; text-decoration: none;"><span class="ic" style="font-size: 24px;" aria-hidden="true">arrow_back</span></a>
      <span style="position: absolute; left: 16px; bottom: 16px; display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 12px; border-radius: 9999px; background: #FFFFFF; color: #1B1B1B; font-size: 12px; line-height: 16px; font-weight: 700;"><span class="ic fill" style="font-size: 16px; color: #00A896;" aria-hidden="true">forest</span>Alam</span>
      <span style="position: absolute; right: 12px; bottom: 12px; padding: 2px 8px; border-radius: 6px; background: rgba(0,0,0,0.55); color: #FFFFFF; font-size: 11px; line-height: 16px;">Foto: [atribusi Google]</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 20px; padding: 20px 20px 24px;">
      <!-- Title, price, duration -->
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <h1 style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 800;">Air Terjun Tegenungan</h1>
        <div style="display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 14px; line-height: 20px; color: var(--muted);">
          <span style="display: inline-flex; align-items: center; gap: 4px;"><span class="ic" style="font-size: 18px;" aria-hidden="true">payments</span>Hemat · ± Rp25.000 per orang</span>
          <span style="display: inline-flex; align-items: center; gap: 4px;"><span class="ic" style="font-size: 18px;" aria-hidden="true">schedule</span>± 1–2 jam</span>
        </div>
      </div>

      <!-- Why it fits (the same AI reason as on the card) -->
      <p style="margin: 0; display: flex; gap: 8px; padding: 12px; border-radius: 12px; color: var(--ai-text); font-size: 14px; line-height: 20px; background: var(--ai-bg);"><span class="ic fill" style="font-size: 18px; flex-shrink: 0;" aria-hidden="true">auto_awesome</span>Cocok dengan minat alam dan gaya santaimu; bisa digabung dengan kunjungan ke Ubud.</p>

      <section style="display: flex; flex-direction: column; gap: 10px;" aria-busy="true" aria-label="Memuat detail">
        <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; color: var(--ai-text);"><span class="ic fill" style="font-size: 14px;" aria-hidden="true">auto_awesome</span>Menyiapkan detail tempat…</div>
        <div style="height: 16px; width: 140px; border-radius: 8px; background: var(--skel);"></div>
        <div style="height: 14px; border-radius: 7px; background: var(--skel);"></div>
        <div style="height: 14px; border-radius: 7px; background: var(--skel);"></div>
        <div style="height: 14px; width: 70%; border-radius: 7px; background: var(--skel);"></div>
        <div style="height: 16px; width: 120px; margin-top: 12px; border-radius: 8px; background: var(--skel);"></div>
        <div style="height: 14px; border-radius: 7px; background: var(--skel);"></div>
        <div style="height: 14px; width: 80%; border-radius: 7px; background: var(--skel);"></div>
        <div style="height: 120px; margin-top: 12px; border-radius: 16px; background: var(--skel);"></div>
      </section>
    </div>
  </div>

  <!-- Same decision buttons as the swipe screen, so the user decides without going back -->
  <div style="display: flex; align-items: center; justify-content: center; gap: 24px; padding: 12px 16px 28px; flex-shrink: 0; background: var(--surface); border-top: 1px solid var(--line);">
    <button aria-label="Lewati" style="width: 64px; height: 64px; border-radius: 9999px; border: 1px solid var(--line); background: var(--card); color: var(--muted); box-shadow: 0px 4px 8px rgba(0,0,0,0.08); display: flex; align-items: center; justify-content: center; padding: 0;"><span class="ic" style="font-size: 32px;" aria-hidden="true">close</span></button>
    <button aria-label="Simpan ke itinerary" style="flex-grow: 1; max-width: 240px; height: 56px; border-radius: 9999px; border: 0; color: #FFFFFF; background: #D92D7B; box-shadow: 0px 4px 8px rgba(0,0,0,0.08), 0px 12px 28px rgba(0,0,0,0.12); display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 24px; font-size: 16px; line-height: 24px; font-weight: 700;"><span class="ic fill" style="font-size: 24px;" aria-hidden="true">favorite</span>Simpan</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
