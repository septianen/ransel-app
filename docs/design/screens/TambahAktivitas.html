<div style="position: relative; width: 390px; height: 1010px; box-sizing: border-box; background: #FFFFFF; color: #1B1B1B; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">

        <button role="radio" aria-checked="false" style="position: relative; height: 76px; box-sizing: border-box; border-radius: 16px; border: 1px solid #E2E2E2; background: #FFFFFF; color: #1B1B1B; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 0;"><span style="width: 36px; height: 36px; border-radius: 10px; background: #7C2D92; color: #FFFFFF; display: flex; align-items: center; justify-content: center;"><span class="ic fill" style="font-size: 20px;" aria-hidden="true">hotel</span></span><span style="font-size: 12px; line-height: 16px; font-weight: 600;">Menginap</span></button>

        <button role="radio" aria-checked="false" style="position: relative; height: 76px; box-sizing: border-box; border-radius: 16px; border: 1px solid #E2E2E2; background: #FFFFFF; color: #1B1B1B; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 0;"><span style="width: 36px; height: 36px; border-radius: 10px; background: #844C1C; color: #FFFFFF; display: flex; align-items: center; justify-content: center;"><span class="ic fill" style="font-size: 20px;" aria-hidden="true">event</span></span><span style="font-size: 12px; line-height: 16px; font-weight: 600;">Lainnya</span></button>

        <button role="radio" aria-checked="true" style="flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 56px; padding: 0 16px; border-radius: 16px; border: 1px solid #008808; background: #D2F9C4; color: #013A00;"><span style="font-size: 14px; line-height: 20px; font-weight: 700;">Hari 2</span><span style="font-size: 12px; line-height: 16px;">21 Nov</span></button>
        <button role="radio" aria-checked="false" style="flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 56px; padding: 0 16px; border-radius: 16px; border: 1px solid #E2E2E2; background: #FFFFFF; color: #1B1B1B;"><span style="font-size: 14px; line-height: 20px; font-weight: 700;">Hari 3</span><span style="font-size: 12px; line-height: 16px; color: #525252;">22 Nov</span></button>

    <div style="display: flex; flex-direction: column; gap: 4px;">
      <span style="font-size: 14px; line-height: 20px; font-weight: 700;">Jam <span style="font-weight: 400; color: #525252;">(opsional)</span></span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
        <a href="PilihJam.dc.html" aria-label="Jam mulai 16.30" style="box-sizing: border-box; height: 48px; padding: 0 12px; border: 1px solid #777777; border-radius: 12px; background: #FFFFFF; color: #1B1B1B; display: flex; align-items: center; gap: 8px; font-size: 16px; line-height: 24px; text-decoration: none; white-space: nowrap;"><span class="ic" style="font-size: 20px; color: #525252;" aria-hidden="true">schedule</span><span style="flex-grow: 1;">16.30</span><span style="font-size: 12px; line-height: 16px; color: #525252;">Mulai</span></a>
        <a href="PilihJam.dc.html" aria-label="Jam selesai 19.00" style="box-sizing: border-box; height: 48px; padding: 0 12px; border: 1px solid #777777; border-radius: 12px; background: #FFFFFF; color: #1B1B1B; display: flex; align-items: center; gap: 8px; font-size: 16px; line-height: 24px; text-decoration: none; white-space: nowrap;"><span class="ic" style="font-size: 20px; color: #525252;" aria-hidden="true">schedule</span><span style="flex-grow: 1;">19.00</span><span style="font-size: 12px; line-height: 16px; color: #525252;">Selesai</span></a>
      </div>
      <span style="font-size: 12px; line-height: 16px; color: #525252;">Durasi 2 jam 30 menit</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px;">
      <label for="act-place" style="font-size: 14px; line-height: 20px; font-weight: 700;">Tempat</label>
      <div style="box-sizing: border-box; height: 48px; padding: 0 12px; border: 1px solid #777777; border-radius: 12px; background: #FFFFFF; color: #1B1B1B; display: flex; align-items: center; gap: 8px; font-size: 16px; line-height: 24px; text-decoration: none; white-space: nowrap;"><span class="ic" style="font-size: 20px; color: #525252;" aria-hidden="true">location_on</span><input id="act-place" value="Pura Luhur Uluwatu, Pecatu" style="flex-grow: 1; min-width: 0; border: 0; outline: none; padding: 0; background: transparent; color: #1B1B1B; font-size: 16px; line-height: 24px;"></div>

    </div>

    <div style="display: flex; flex-direction: column; gap: 4px;">
      <label for="act-link" style="font-size: 14px; line-height: 20px; font-weight: 700;">Link booking <span style="font-weight: 400; color: #525252;">(opsional)</span></label>
