<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Buat trip</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400..600,0..1,0&amp;display=block">
<style>
body{margin:0}
.ic{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;line-height:1;display:inline-block;font-variation-settings:"FILL" 0,"wght" 500,"GRAD" 0,"opsz" 24;font-feature-settings:"liga";-webkit-font-smoothing:antialiased}
.fill{font-variation-settings:"FILL" 1,"wght" 500,"GRAD" 0,"opsz" 24}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}

</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #1B1B1B; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
  <header style="display: flex; align-items: center; gap: 4px; height: 56px; padding: 0 4px; flex-shrink: 0; border-bottom: 1px solid #E2E2E2;">
    <a href="Main.dc.html" aria-label="Tutup" style="width: 48px; height: 48px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; color: #1B1B1B; text-decoration: none;"><span class="ic" style="font-size: 24px;" aria-hidden="true">close</span></a>
    <h1 style="margin: 0; padding-left: 4px; font-size: 18px; line-height: 24px; font-weight: 700;">Buat trip</h1>
  </header>
  <main style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 20px; padding: 16px 16px 24px;">
    <button style="height: 132px; flex-shrink: 0; border-radius: 16px; border: 1.5px dashed #777777; background: #F9F9F9; color: #1B1B1B; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0;">
      <span style="width: 44px; height: 44px; border-radius: 12px; background: #00A5EC; color: #FFFFFF; display: flex; align-items: center; justify-content: center;"><span class="ic fill" style="font-size: 24px;" aria-hidden="true">add_photo_alternate</span></span>
      <span style="font-size: 14px; line-height: 20px; font-weight: 700; margin-top: 4px;">Tambah foto sampul</span>
      <span style="font-size: 12px; line-height: 16px; color: #525252;">Opsional · JPG atau PNG, maks 5 MB</span>
    </button>

    <div style="display: flex; flex-direction: column; gap: 4px;">
      <label for="trip-name" style="font-size: 14px; line-height: 20px; font-weight: 700;">Nama trip</label>
      <input id="trip-name" value="Bali 4 hari" style="box-sizing: border-box; height: 48px; padding: 0 12px; border: 1px solid #777777; border-radius: 12px; background: #FFFFFF; color: #1B1B1B; font-size: 16px; line-height: 24px; outline: none;border: 2px solid #008808; padding: 0 11px;">
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px;">
      <label for="trip-dest" style="font-size: 14px; line-height: 20px; font-weight: 700;">Destinasi</label>
      <div style="box-sizing: border-box; height: 48px; padding: 0 12px; border: 1px solid #777777; border-radius: 12px; background: #FFFFFF; color: #1B1B1B; display: flex; align-items: center; gap: 8px; font-size: 16px; line-height: 24px; text-decoration: none; white-space: nowrap;"><span class="ic" style="font-size: 20px; color: #525252;" aria-hidden="true">location_on</span><input id="trip-dest" value="Bali, Indonesia" style="flex-grow: 1; min-width: 0; border: 0; outline: none; padding: 0; background: transparent; color: #1B1B1B; font-size: 16px; line-height: 24px;"></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px;">
      <span style="font-size: 14px; line-height: 20px; font-weight: 700;">Tanggal</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
        <a href="PilihRentangTanggal.dc.html" aria-label="Tanggal mulai, Jumat 20 November 2026" style="box-sizing: border-box; height: 48px; padding: 0 12px; border: 1px solid #777777; border-radius: 12px; background: #FFFFFF; color: #1B1B1B; display: flex; align-items: center; gap: 8px; font-size: 16px; line-height: 24px; text-decoration: none; white-space: nowrap;"><span class="ic" style="font-size: 20px; color: #525252;" aria-hidden="true">flight_takeoff</span>Jum, 20 Nov</a>
        <a href="PilihRentangTanggal.dc.html" aria-label="Tanggal selesai, Senin 23 November 2026" style="box-sizing: border-box; height: 48px; padding: 0 12px; border: 1px solid #777777; border-radius: 12px; background: #FFFFFF; color: #1B1B1B; display: flex; align-items: center; gap: 8px; font-size: 16px; line-height: 24px; text-decoration: none; white-space: nowrap;"><span class="ic" style="font-size: 20px; color: #525252;" aria-hidden="true">flight_land</span>Sen, 23 Nov</a>
      </div>
      <span style="display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; height: 28px; padding: 0 10px; margin-top: 4px; border-radius: 9999px; background: #D2F9C4; color: #013A00; font-size: 12px; line-height: 16px; font-weight: 700;"><span class="ic fill" style="font-size: 16px;" aria-hidden="true">calendar_month</span>4 hari · 3 malam</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px;">
      <span style="font-size: 14px; line-height: 20px; font-weight: 700;">Mata uang utama</span>
      <button style="box-sizing: border-box; height: 48px; padding: 0 12px; border: 1px solid #777777; border-radius: 12px; background: #FFFFFF; color: #1B1B1B; display: flex; align-items: center; gap: 8px; font-size: 16px; line-height: 24px; text-decoration: none; white-space: nowrap; text-align: left; font-family: inherit;"><span style="display: inline-flex; align-items: center; justify-content: center; min-width: 40px; height: 24px; border-radius: 6px; background: #F3F3F3; font-size: 12px; line-height: 16px; font-weight: 700;">IDR</span><span style="flex-grow: 1;">Rupiah Indonesia</span><span class="ic" style="font-size: 20px; color: #525252;" aria-hidden="true">expand_more</span></button>
      <span style="font-size: 12px; line-height: 16px; color: #525252;">Pengeluaran dalam mata uang lain dikonversi ke IDR.</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px;">
      <label for="trip-budget" style="font-size: 14px; line-height: 20px; font-weight: 700;">Budget <span style="font-weight: 400; color: #525252;">(opsional)</span></label>
      <div style="box-sizing: border-box; height: 48px; padding: 0 12px; border: 1px solid #777777; border-radius: 12px; background: #FFFFFF; color: #1B1B1B; display: flex; align-items: center; gap: 8px; font-size: 16px; line-height: 24px; text-decoration: none; white-space: nowrap;"><span style="font-weight: 600; color: #525252;">Rp</span><input id="trip-budget" value="5.000.000" inputmode="numeric" placeholder="0" style="flex-grow: 1; min-width: 0; border: 0; outline: none; padding: 0; background: transparent; color: #1B1B1B; font-size: 16px; line-height: 24px; font-weight: 700; font-feature-settings: 'tnum';"></div>
    </div>
  </main>
  <div style="flex-shrink: 0; padding: 12px 16px 16px; background: #FFFFFF; box-shadow: 0px -2px 12px rgba(0,0,0,0.08);">
    <a href="Itinerary.dc.html" style="height: 48px; border-radius: 9999px; background: #008808; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; line-height: 24px; font-weight: 700; text-decoration: none;">Buat trip</a>
  </div>
</div>
